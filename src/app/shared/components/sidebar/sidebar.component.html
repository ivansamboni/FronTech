<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">Vet<span>Care</span></div>
  <div class="sidebar-sub">Sistema de Gestión</div>

  <!-- Menú de navegación -->
  <nav style="display: flex; flex-direction: column; gap: 4px;">
    @for (item of navItems; track item.path) {
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
      >
        <!-- Ícono SVG -->
        <svg
          width="18" height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path [attr.d]="item.icon" />
        </svg>

        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Usuario logueado + botón de logout (pegado al fondo) -->
  <div style="margin-top: auto;">

    @if (authService.currentUser(); as user) {
      <div class="sidebar-user">

        <!-- Círculo con las iniciales -->
        <div class="sidebar-avatar">{{ initials() }}</div>

        <!-- Nombre y rol -->
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">{{ user.name }}</div>
          <div class="sidebar-user-role">
            {{ roleLabels[user.role] || user.role }}
          </div>
        </div>

        <!-- Botón cerrar sesión -->
        <button class="logout-btn" title="Cerrar sesión" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>

      </div>
    }

    <div class="sidebar-footer">© 2026 VetCare</div>
  </div>

</aside>
